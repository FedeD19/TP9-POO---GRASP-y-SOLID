# Propiedades SOLO para mvn test; no modifican la API que se ejecuta en :8080.
# Nombre distinto al de la aplicacion y cierre automatico al liberar las conexiones.
spring.datasource.url=jdbc:h2:mem:smartticket_pruebas;DB_CLOSE_DELAY=0;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# El esquema nace y se destruye con el contexto de pruebas.
spring.jpa.hibernate.ddl-auto=create-drop

# Menos ruido en el log de Maven; no cambia las validaciones ni los tests.
spring.jpa.show-sql=false
