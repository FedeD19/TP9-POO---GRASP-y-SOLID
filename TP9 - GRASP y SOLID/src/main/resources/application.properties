# Servidor
spring.application.name=smartticket
server.port=8080

# Base de datos H2 en memoria (se reinicia junto con el servidor)
spring.datasource.url=jdbc:h2:mem:smartticket;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea/actualiza las tablas del entorno de practica
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Consola web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger/OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

# HU 3: zona horaria local para validar el dia del evento y guardar el ingreso.
smartticket.zona-horaria=America/Argentina/Buenos_Aires
